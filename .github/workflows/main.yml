name: Bloqbit Test Build

on: [push, pull_request]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.1.0'
          check-latest: true

      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm install

      - name: Check for native Rust bindings
        id: check_napi
        run: |
          if [ -f native/Cargo.toml ]; then
            echo "napi=true" >> $GITHUB_OUTPUT
          else
            echo "napi=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Rust (only if napi is used)
        if: steps.check_napi.outputs.napi == 'true'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Cache Rust (only if napi is used)
        if: steps.check_napi.outputs.napi == 'true'
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: Build native bindings
        if: steps.check_napi.outputs.napi == 'true'
        run: npm run build:napi

      - name: Build project
        run: npm run build

      - name: Clean up build artifacts
        run: npm run clean
